<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Custom Game Platform</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
  }
  .game {
    background: #333;
    margin: 10px auto;
    padding: 20px;
    width: 80%;
    border-radius: 8px;
    text-align: center;
  }
  a {
    color: #00f;
    font-size: 20px;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<h1>My Custom Game Platform</h1>
<div class="game">
  <h2>Game 1</h2>
  <p><a href="https://yourdomain.com/redirect/game1" target="_blank">Play Game 1</a></p>
</div>
<div class="game">
  <h2>Game 2</h2>
  <p><a href="https://yourdomain.com/redirect/game2" target="_blank">Play Game 2</a></p>
</div>
</body>
</html>
